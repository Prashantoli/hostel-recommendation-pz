version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hostel_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: hostel_finder
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - hostel_network

  # Node.js Application
  app:
    build: .
    container_name: hostel_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/hostel_finder?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_here_make_it_long_and_random
      SESSION_SECRET: your_session_secret_make_it_random_and_secure
      GOOGLE_CLIENT_ID: your_google_client_id_here
      GOOGLE_CLIENT_SECRET: your_google_client_secret_here
      FACEBOOK_APP_ID: your_facebook_app_id_here
      FACEBOOK_APP_SECRET: your_facebook_app_secret_here
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - hostel_network
    command: npm start

  # MongoDB Express (Optional - Database Admin UI)
  mongo-express:
    image: mongo-express:latest
    container_name: hostel_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - hostel_network

volumes:
  mongodb_data:

networks:
  hostel_network:
    driver: bridge
